  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3j0119_WYG_004-1a, image: WYG0864/WYG0864-0603a.png}
body:
  text: 游宦紀聞卷四宋張世南撰永福下鄉有農家子姓張以採薪鬻鋤柄為業鄉人目為張鋤柄狀貌醜怪口能容拳一日入山遇仙人對奕投之以桃苦不可食張心知為仙冀有所遇忍苦噉咽且及半若將螫舌遂弃其餘而歸因忽忽若狂絶粒食草木實時言人隱惡能道未來禍福素不諳書忽奮筆作字得羲獻體口占頌偈立成如宿搆傳聞四散士夫多往赴之因度為僧人號為張聖者游邑中募緣造高蓋石橋富屋揮金相先人曰聖者作大功德又自可無一頌語僧笑云只兩好事石橋半出通判石橋全出狀元無庸頌也及侍講蕭公國梁魁天下乃生於橋成之月橋方半時實生通判吳公時有黃倅少魏未第倦游太學善人倫者多言其油膩天羅屯滯相也黃稍稍有沮意僧且謂曰待我及第日汝當及第乃自笑謂僧人及第理所無也既而黃以張安國榜中第訪張僧乃近住安國寺云僧發狂時言無不驗其言禍敗事尤竒中人於狂時亦畏其毒罵莫敢詣者作字多以左手或以足指挾筆又時扱筆書時里中有吳氏建重光寺輪藏成求讚於僧援筆立就云無上雄文貝葉鮮幾生三藏往西天行行字字為珍寶句句言言是福田苦海波中猴行復况毛江上馬駝前長沙過了金沙難望岸還知到岸緣夜義歡喜隨心答菩薩精䖍合掌傳半千六十餘函在功德難量熟處圓筆力遒徑可愛一日游白面村有少婦隨衆往謁僧命至前痛撮其項婦號叫觀者哄堂大哂歸語其夫夫怒奮臂勇往詬罵僧笑曰子毋怒公案未了宜令再來罵者不聽居亡何婦以他恚投繯而死又有鄉民著新紫襦詣謁僧請以為施民有難色僧曰急抖擻去狗毛蓋民竊烹鄰狗得襦人無知者故戲之又有富室㩦少女求頌僧曰好弓鞋敢求一隻語再四不得已遺之即裂其底得襯紙乃佛經也神異多類此後遊郡郛大為帥府賞識十禪僧頗多類此忌疾中傷之不可及冬一夕張坐定有青衣擎生荔一柈獻詰旦遺遣郡帥是日十禪朔參帥舉似之中一僧云得毋詐耶山間偶亦有此歸獻百顆蓋郡中多以穰代薪獻臺禾熟時寺倉積穰荔樹上及冬穰空荔實偶尚無恙得以巧設欺計帥亦因此疏張人謂張狂時最靈豈獻荔之夕適㑹其不狂耶張自遇異人後絶烟火走人間五十餘年竒事不止如此友人吳信可永福人為豫言是數事皆其髫齔時得之鄉里長老末議且神仙方技祕怪之事書傳所記從古有之然詭誕不經無補世教而君子存之者豈非以其能言禍福於無形之先使不知命者有所悟至於發人隱惡雖虧雅道亦使暗室屋漏之下有所警是亦小道之可觀者不然亦何足尚云福之永福西山曰高蓋為天下第一福地出縣郭陟峻嶺山行五十里而近最上處有禪剎曰名山徐真君上升東西二室歸寂其所也朝廷纍降御香有樵禁該曲臺祀典石門插天杉檜晝暝猿狖清嘯與寒泉響答真偉觀也徐本牧兒飯牛山椒一日聞樂聲出林杪緣崖造觀至則有二人奕拱立良久遺徐棊子一叱令歸歸即精解手談時碎瓦器為子布地為局縱遊巖上往往與二人遇遂得修行燒煉訣有趙真君不逺千里訪之以所得祕密與之參契徐喜酌酒共飲草廬中時霜月草木雕空徐曰主人遠訪無以為樂以餘瀝一濆頃刻林花遍開今名所居曰花林莊徐功行成將入山煉大丹仙去埋棊子田中涌土成墩植牛杖其傍旋生枝葉今老樹尚存嘗有耕者發墩致風雷之變至今相指為戒丹成之日與兄弟姊妹七人餌之同時上升故其地七仙有亭徐趙二真君有祠云自仙羽化後俗眼凡骨莫有一詣其上者數百年下有浙僧㩦小師來主寺有輕身術偕至徐君壇得二石室乃鑿山通道飛磴自石門中出始盡發地祕四方遊者於是翕集其東室明潔前有水簾自千仞崖顛垂空而下如其門之廣山中佳致可坐而揖西則暗藹亦不乏竒觀獨去洞數步有石龜與石棊枰對立古老相傳云龜舊處室中徐君叱而出之其事頗誕一日東室主僧赴邑齊㑹小師乘其逺出趨師牀坐逝主僧於齊席中即知之嘆云叵耐小鬼奪我山中佳處亦即席坐逝其徒議舁歸以登涉之勞乃茶毗囊骨歸塑西室雖加丹粉作喜色每一風雨即脫落如怒或者猶疑二僧禪寂雖高而貪嗔一念未能了然者小師之趨東室也急欲化去跏趺不盡一腳數十年前有髙僧數其敗教之罪摺而正之言其中如敗炊餅云耳目所得梗概如此高蓋為閩中佳山雖僻左名勝往往逺從游覽吟題甚富有一聯云雲幄護壇仙世界水簾遮室佛家風時人賞之以為能㸃出山中眼目云永福古有䜟語曰天保石移瑞雲來竒龍爪花紅狀元西東乾道間福清天保瑞雲寺後石崖橫山而行齧地成蹊既而永邑東鄉石壁溪巖松上産龍爪瑞花其年蕭公國梁果魁天下次舉黃公定臚唱第一蓋瑞花生處西之於蕭東之於黃各三十五里此狀元西東之應也又次舉鄭公僑廷試復先多士邑宰見黃丰姿秀發驚喜曰有如此竒男子安得出我門下既而豫薦尉喜甚約妻以女及中第日尉已捐館其妻挈纍扶櫬相遇於中途黃哭之慟命逆旅主人逹情請遂初約夫人曰往事尚忍言之哉無祿縣尉清貧死無餘資吾㩦百指扶護而歸衣衾斥賣殆盡方以不逹鄉井為慮那可復議臠先輩事况黃甲少年當結好鼎族吾且行矣善為我辭黃垂涕曰嗚呼吾許人以諾死而負之吾行將何歸夫人不念死者言乃作世俗炎凉語茍遂吾志秋毫自齎不敢聞命也遂定婚於邂逅間分㩦慟哭而别某氏從公歸能執婦道琴瑟在御沒齒無間言公登從橐夫人尚無恙若公者可謂有德有言者也噫今之年少弄筆墨取科第者項背相望聞公之風盍亦知所以自省哉永福邑東三十五里曰三島村村東北山曰方廣巖往昔荆榛䝉茸不可上給事黃公築室讀書山下一日獵師逐獸歸能言其境給事命僕剪荆劚險攀緣而上抵一石室下可蔽千人鄉人從往即其地奉浮屠故水旱必於此乎禱後數年水暴至漂一巨木長可丈餘廣半之臥山下者纍月風雨晦暝之夕往往若有神光舁致室中亡何有異人來請斫為賓頭盧尊者像像成不受直去莫知所之今縣官禱雨必躬往迎致其應如響像眉毫修白骨氣龍鍾殆若生動每至邑中人士敬嘆瞻禮喜其來而惜其去好事者至有命精工模倣以易之雖毫髮無缺精神莫具不獨主巖者能辨之自造像後香火日昌往來供施相屬室內遂搆三層閣不戴片瓦雖疾風暴雨不能犯也室距平地可五里許其間梁空磴險山徑峭拔遊者有攀躋傴僂之難及最上峯回路轉倐忽風景不同巖洞飛驚臺殿縹眇使人神觀軒豁忘其罷憊周回有十竒如石門水簾瀑布石燈石鐘磬觀音影之類皆自然天巧居最者有龍尾泉狀如石龍裂巖而去尚餘不盡尾修及尋丈望之作蜿蜒勢尾鋒湧泉一滴冬夏不枯人敬其水以為佛供越室而右有羚羊洞云其中可容三四人作詩云翀峯龜嶺與龍嶼三處家山一壯哉相去未逾一百里七年三度狀元來蓋蕭公翀峯鄭公龜嶺黃公龍嶼也蕭公登科歲第一人本丞相忠定趙公故事設科以待草茅士凡豫屬籍挂仕版者法當遜避唱名曰升蕭公為榜首故蕭公對御吟有名傳玉陛星辰曉澤霈金枝雨露春之句其謝啓有云豫飛龍之選淮安論次以當先無汗馬之勞鄼侯何功而居上蓋用宗室及蕭家事至今膾炙人口因並書之永福邑有東嶽宫乃吳太博經創大門內建三清殿上梁日邑中諸寓公咸在吳以書梁儷語首遜給事黃公龜年公即領略立解手帖濡墨作字云風馬雲車儷百順勾陳之衛金枝玉葉拱萬齡宸極之尊詞語鏗潤筆法髙古太博初見公略不經思復疑帛書非法既而雙美吳始大喜心服歸語家人子姪輩曰吾邦山川之秀有如此公者操行過人數等不獨詞翰可敬其未第時最貧素自處淡如應鄉貢引保日有考官某縣尉居簾內見公十輩微徑僅可著足下臨無際人莫敢進獨主巖者藏貯其中來往如猱亦野性便習然也詹事王公十朋曽游作十竒律詩五言六十字見公集內士友吳信可亦有紀游詩云曾訪神仙巖洞來人言偉觀似天台藤蘿足下猿猱嘯鐘鼓聲邉日月開燈續佛光凝紫翠雲將蜃氣作樓臺最憐貫石神龍尾猶帶天東雨露回巖中乞靈多驗如前司農薄柯公垓少時鄉試回嘗徑從主巖者先夜夢尊者命之曰可設榻煮茗來日當有十九歲官人來及期與公同游者十餘人老行前致茶問稠中誰為十九歲官人遂以夢告柯公是歲鄉舉次年登科果如其言已上六說皆友人吳兄信可為世南言信可諱錡永福人誠敬而疏通博學而和粹月旦之評最所推重世南方以得友為喜納友不百日而遂隔今古嗟乎信可踐履如此而遽止於斯亦可悲也已追思紀録以備遺忘借書一癡還書一癡或作嗤字此鄙俗無狀語前輩謂借書還書皆以一瓻禮部韻云瓻盛酒器也山谷以詩借書目於胡朝請末聯云願公借我藏書目時送一鴟開鎖魚坡公和陶詩云不持兩鴟酒肯借一車書吳王取伍子胥尸盛以鴟夷革浮之水中應劭曰取馬革為鴟夷榼形范蠡號鴟夷子皮師古曰若盛酒之鴟夷揚子雲酒針鴟夷滑稽腹大如壺師古云鴟夷革囊以盛酒也蘇黃用鴟字本此游宦紀聞卷四
